### model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
trust_remote_code: true
image_max_pixels: 200704  # 448 * 448
image_min_pixels: 200704  # keep the visual grid fixed
uc_visual_adaptation: true
uc_visual_crop_probability: 0.5
uc_visual_crop_min_ratio: 0.125  # 1/8 of the original dimension
uc_visual_crop_max_ratio: 0.25   # 1/4 of the original dimension
uc_visual_output_size: 448

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_target:
  - attn.qkv
  - attn.proj
  - mlp.gate_proj
  - mlp.up_proj
  - mlp.down_proj
freeze_vision_tower: false
freeze_language_model: true

### dataset
dataset: vision_tower
template: qwen2_vl
cutoff_len: 2048
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/uc_vlm/qwen2_5vl_visual_adaptation/lora/sft
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
